[package]
name = "launchertps"
version = "0.1.2"
description = "TP LAUNCHER · Minecraft Java, contenido y creación"
authors = ["TP LABS"]
edition = "2024"



[lib]



name = "launchertps_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
tokio = { version = "1", features = ["full"] }
zip = "2.1"
dirs = "5.0"
uuid = { version = "1.10", features = ["v3", "v4"] }
futures-util = "0.3"
base64 = "0.22"
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
sha1 = "0.10"
sha2 = "0.10"
regex = "1"
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
toml = "0.8"
discord-rich-presence = "0.2"
semver = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_Threading"] }



[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

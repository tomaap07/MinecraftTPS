plugins { id 'net.fabricmc.fabric-loom-remap' version '1.17.21' }
version = '0.1.0'
group = 'dev.tplauncher'
base { archivesName = 'tp-companion' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.20.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1'
}
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
processResources { inputs.property 'version',project.version; filesMatching('fabric.mod.json') { expand version:project.version } }
jar { from('../LICENSE') { rename { 'LICENSE_TP_LAUNCHER' } } }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps=false; reproducibleFileOrder=true }

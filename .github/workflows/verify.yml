name: Verify launcher and TP Client

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interface-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tp-api/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run check:ui
      - run: npm run build
      - run: npm ci
        working-directory: tp-api
      - run: npm test
        working-directory: tp-api

  windows-core-and-mod:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: python -m pip install Pillow==12.3.0
      - run: npm run build:desktop
      - run: cargo test --locked --quiet
        working-directory: src-tauri
